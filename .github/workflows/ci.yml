name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, for the vulncheck job specifically. Advisory results are
  # TIME-varying while push/pull_request are CHANGE-varying: a CVE published
  # tomorrow against the pinned adapter trees would otherwise stay invisible
  # until someone happened to open a PR.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege by default; no job here writes to the repo. Without this
# every job — including the one that runs goreleaser — gets the default
# GITHUB_TOKEN scope.
permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

  # Dependency advisories. This provider's entire threat model is credential
  # handling, so a vulnerable dependency in either ecosystem is directly on
  # the path of a workspace-owner PAT.
  #
  # Both are needed because they cover disjoint trees. govulncheck reads
  # go.mod (5 direct dependencies); the two npm ACP adapter lockfiles are
  # integrity-pinned by sha512, which proves the bytes match what the
  # registry served when the lockfile was generated — it says nothing about
  # whether those bytes were later found vulnerable. `npm audit` against the
  # committed lockfiles is the analogous gate, and --package-lock-only keeps
  # it from installing the ~900 MB of adapter trees to do it.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: |
          # Pinned, not @latest: an unpinned tool makes the gate
          # non-reproducible run to run, and this repo's threat model is
          # credential handling.
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: npm audit (committed adapter lockfiles)
        run: |
          set -eu
          rc=0
          for lock in internal/install/lockfiles/*.package-lock.json; do
            name=$(basename "$lock" .package-lock.json)
            work=$(mktemp -d)
            # npm audit needs the manifest beside the lockfile; the lockfile's
            # own root entry carries the name/version the manifest must match.
            cp "$lock" "$work/package-lock.json"
            python3 - "$work" <<'PYEOF'
          import json, sys, os
          work = sys.argv[1]
          lock = json.load(open(os.path.join(work, "package-lock.json")))
          root = lock["packages"][""]
          json.dump({
              "name": lock["name"],
              "version": lock.get("version", "0.0.0"),
              "private": True,
              "dependencies": root.get("dependencies", {}),
          }, open(os.path.join(work, "package.json"), "w"))
          PYEOF
            echo "::group::npm audit $name"
            ( cd "$work" && npm audit --package-lock-only --audit-level=high ) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  cross-compile:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /tmp/buzz-backend-databricks-lakebox ./cmd/buzz-backend-databricks-lakebox

  goreleaser:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: goreleaser snapshot dry-run
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
